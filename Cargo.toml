[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
eink = { path = "crates/eink" }
fontdue = "0.9.5"
franken_markdown = { git = "https://github.com/igouss/franken_markdown", rev = "4b705d147c10cebb52866f37dbdb1492ce8505ea", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["ioctl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
wildcard_enum_match_arm = "deny"

[profile.release]
panic = "abort"
lto = true
strip = true
