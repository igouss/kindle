description "default route and resolvers over the USBNetwork link"

start on started usbnet

task

script
	ifconfig usb0 >/dev/null 2>&1 || exit 0
	route -n | grep -q '^0\.0\.0\.0 .*usb0$' || route add default gw 192.168.15.201 usb0
	printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /var/run/resolv.conf
end script
