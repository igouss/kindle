description "the Claude Code usage dashboard in place of the Kindle UI"

start on started framework
stop on stopping x

respawn
normal exit 0

pre-start script
	[ -e /mnt/us/kindle-dev/dashboard.on ] || { stop; exit 0; }
	[ -e /var/run/dashboard.off ] && { stop; exit 0; }
	waited=0
	until pidof dropbear >/dev/null; do
		[ $waited -ge 60 ] && { stop; exit 0; }
		sleep 1
		waited=$((waited + 1))
	done
	stop lab126_gui || true
	lipc-set-prop com.lab126.powerd preventScreenSaver 1
	lipc-set-prop com.lab126.powerd wakeUp 1 || true
end script

exec /mnt/us/kindle-dev/usage serve
